name: CI

on:
  push:
    branches: [master, main, develop]
    tags:
      - '*'
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 3.4.12)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build web UI and firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./vue/package-lock.json

      - name: Install web dependencies
        working-directory: ./vue
        run: npm ci

      - name: Type check
        working-directory: ./vue
        run: npm run typecheck

      - name: Lint
        working-directory: ./vue
        run: npm run lint

      - name: Build web UI
        working-directory: ./vue
        run: npm run build-web

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e esp32-c3-devkitm-1

      - name: Build LittleFS
        run: pio run -e esp32-c3-devkitm-1 -t buildfs

      - name: Collect release files
        run: |
          cp build/esp32-c3-devkitm-1/firmware.bin esp32-c3-devkitm-1_firmware.bin
          cp build/esp32-c3-devkitm-1/littlefs.bin esp32-c3-devkitm-1_littlefs.bin
          ls -lh esp32-c3-devkitm-1_firmware.bin esp32-c3-devkitm-1_littlefs.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-c3
          path: |
            esp32-c3-devkitm-1_firmware.bin
            esp32-c3-devkitm-1_littlefs.bin
          retention-days: 30

  scriptrunner:
    name: ScriptRunner unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compilers
        run: sudo apt-get install -y g++ clang

      - name: Build tests (${{ matrix.compiler }})
        working-directory: src/tests
        run: ${{ matrix.compiler }} -std=c++11 -I../src -o test_runner test_runner.cpp arduino_stub.cpp ../runner/ScriptRunner.cpp

      - name: Run tests (${{ matrix.compiler }})
        working-directory: src/tests
        run: ./test_runner

  release:
    name: Publish firmware release
    runs-on: ubuntu-latest
    needs: [build, scriptrunner]
    if: |
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32-c3
          path: release

      - name: Create release manifest
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          {
            echo "{"
            echo "  \"version\": \"$TAG\","
            echo "  \"tag\": \"$TAG\","
            echo "  \"files\": {"
            first=true
            for file in release/*.bin; do
              name=$(basename "$file" .bin)
              if [ "$first" = true ]; then
                first=false
              else
                echo ","
              fi
              printf "    \"%s\": \"%s/releases/download/%s/%s\"" "$name" "$REPO" "$TAG" "$(basename "$file")"
            done
            echo ""
            echo "  }"
            echo "}"
          } > release.json
          cat release.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Прошивка ${{ steps.vars.outputs.tag }}

            - `esp32-c3-devkitm-1_firmware.bin` — прошивка
            - `esp32-c3-devkitm-1_littlefs.bin` — файловая система

            Прошить можно через USB или через веб-интерфейс на странице проекта в каталоге Vuesp.
          files: |
            release/*.bin
            release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
